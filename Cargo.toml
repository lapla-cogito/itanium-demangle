[package]
name = "itanium-demangle"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A fast Itanium C++ name demangler"
repository = "https://github.com/lapla-cogito/itanium-demangle"
readme = "README.md"
keywords = ["demangle", "itanium"]

[dev-dependencies]
cpp_demangle = "0.5.1"
criterion = "0.8"
pretty_assertions = "1.4.1"

[[bench]]
name = "demangle"
harness = false
